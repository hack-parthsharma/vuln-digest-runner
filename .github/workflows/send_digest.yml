name: Send Vuln Digest to Teams

on:
  push:
    paths:
      - 'latest.json'

jobs:
  send-to-teams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Send to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, re, time

          with open('latest.json') as f:
              d = json.load(f)

          message = d.get('message', 'No content')
          date    = d.get('date', 'Today')

          def md_to_html(text):
              # Split into findings
              sections = re.split(r'(?=\*\*Finding \d+)', text)
              html = ''
              for section in sections:
                  if not section.strip():
                      continue
                  # Finding headers
                  section = re.sub(r'\*\*(Finding \d+)\*\*', r'<br><b>--- \1 ---</b><br>', section)
                  # Bold
                  section = re.sub(r'\*\*(.+?)\*\*', r'<b>\1</b>', section)
                  # Bullet lines
                  section = re.sub(r'^- (.+)$', r'&nbsp;&nbsp;• \1<br>', section, flags=re.MULTILINE)
                  # Line breaks
                  section = section.replace('\n', '<br>')
                  html += section
              return html

          html_message = md_to_html(message)

          CHUNK_SIZE = 7000
          chunks = [html_message[i:i+CHUNK_SIZE] for i in range(0, len(html_message), CHUNK_SIZE)]

          webhook_url = os.environ['TEAMS_WEBHOOK_URL']

          for i, chunk in enumerate(chunks):
              if i == 0:
                  header = f"<b>🔐 Vulnerability Digest — {date}</b><br><br>"
              else:
                  header = f"<b>🔐 Vulnerability Digest — {date} (cont. {i+1})</b><br><br>"

              payload = {
                  "date": date,
                  "message": header + chunk
              }

              body = json.dumps(payload).encode()
              req = urllib.request.Request(
                  webhook_url,
                  data=body,
                  headers={
                      'Content-Type': 'application/json',
                      'Accept': 'application/json'
                  },
                  method='POST'
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      print(f"Chunk {i+1}/{len(chunks)} — Status:", resp.status)
                      print("Response:", resp.read().decode())
              except urllib.error.HTTPError as e:
                  print(f"Chunk {i+1} — HTTP Error:", e.code, e.reason)
                  print("Response:", e.read().decode())
                  raise

              if i < len(chunks) - 1:
                  time.sleep(2)

          print(f"Done — sent {len(chunks)} message(s) to Teams.")
          PYEOF
