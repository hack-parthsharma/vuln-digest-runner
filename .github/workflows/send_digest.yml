name: Send Vuln Digest to Teams

on:
  push:
    paths:
      - 'latest.json'

jobs:
  send-to-teams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Send to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, re, time

          with open('latest.json') as f:
              d = json.load(f)

          message = d.get('message', 'No content')
          date    = d.get('date', 'Today')

          def md_to_plain(text):
              # Convert headers to visual separators
              text = re.sub(r'^## (.+)$', r'━━━━━━━━━━\n\1\n━━━━━━━━━━', text, flags=re.MULTILINE)
              text = re.sub(r'^### (.+)$', r'▸ \1', text, flags=re.MULTILINE)
              # Remove bold markers but keep text
              text = re.sub(r'\*\*(.+?)\*\*', r'\1', text)
              # Keep bullet points as-is (they read fine in plain text)
              return text

          plain_message = md_to_plain(message)

          # Split into chunks
          CHUNK_SIZE = 7000
          chunks = [plain_message[i:i+CHUNK_SIZE] for i in range(0, len(plain_message), CHUNK_SIZE)]

          webhook_url = os.environ['TEAMS_WEBHOOK_URL']

          for i, chunk in enumerate(chunks):
              if i == 0:
                  part_label = f"🔐 Vulnerability Digest — {date}"
              else:
                  part_label = f"🔐 Vulnerability Digest — {date} (cont. {i+1})"

              payload = {
                  "date": date,
                  "message": f"{part_label}\n\n{chunk}"
              }

              body = json.dumps(payload).encode()
              req  = urllib.request.Request(
                  webhook_url,
                  data=body,
                  headers={
                      'Content-Type': 'application/json',
                      'Accept': 'application/json'
                  },
                  method='POST'
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      print(f"Chunk {i+1}/{len(chunks)} — Status:", resp.status)
                      print("Response:", resp.read().decode())
              except urllib.error.HTTPError as e:
                  print(f"Chunk {i+1} — HTTP Error:", e.code, e.reason)
                  print("Response:", e.read().decode())
                  raise

              if i < len(chunks) - 1:
                  time.sleep(2)

          print(f"Done — sent {len(chunks)} message(s) to Teams.")
          PYEOF
