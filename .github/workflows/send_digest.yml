name: Send Vuln Digest to Teams

on:
  push:
    paths:
      - 'latest.json'

jobs:
  send-to-teams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Send to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, re, time

          with open('latest.json') as f:
              d = json.load(f)

          message = d.get('message', 'No content')
          date    = d.get('date', 'Today')

          def format_for_teams(text):
              # Section headers
              text = re.sub(r'^## (.+)$', r'<br><b>🔐 \1</b><br>', text, flags=re.MULTILINE)
              # Finding headers
              text = re.sub(r'\*\*(Finding \d+)\*\*', r'<br><b>─── \1 ───</b><br>', text)
              # Other bold section headers
              text = re.sub(r'\*\*(.+?)\*\*', r'<b>\1</b>', text)
              # Severity with color emoji
              text = re.sub(r'(Severity: Critical[^\n<]*)', r'🔴 <b>\1</b>', text)
              text = re.sub(r'(Severity: High[^\n<]*)', r'🟠 <b>\1</b>', text)
              text = re.sub(r'(Severity: Medium[^\n<]*)', r'🟡 <b>\1</b>', text)
              text = re.sub(r'(Severity: Low[^\n<]*)', r'🟢 <b>\1</b>', text)
              # Bullet fields - bold the label
              text = re.sub(r'^- (Product|Issue|Severity|Description|Relevance|Sources?|Closing):', r'<br>&nbsp;&nbsp;• <b>\1:</b>', text, flags=re.MULTILINE)
              # Remaining bullet lines
              text = re.sub(r'^- (.+)$', r'<br>&nbsp;&nbsp;• \1', text, flags=re.MULTILINE)
              # Newlines to breaks
              text = text.replace('\n', '<br>')
              # Clean up excessive breaks
              text = re.sub(r'(<br>\s*){3,}', '<br><br>', text)
              return text.strip()

          html_message = format_for_teams(message)

          CHUNK_SIZE = 7000
          chunks = [html_message[i:i+CHUNK_SIZE] for i in range(0, len(html_message), CHUNK_SIZE)]

          webhook_url = os.environ['TEAMS_WEBHOOK_URL']

          for i, chunk in enumerate(chunks):
              if i == 0:
                  header = f"<b>🔐 Vulnerability Digest — {date}</b><br><br>"
              else:
                  header = f"<b>🔐 Vulnerability Digest — {date} (cont. {i+1})</b><br><br>"

              payload = {
                  "date": date,
                  "message": header + chunk
              }

              body = json.dumps(payload).encode()
              req = urllib.request.Request(
                  webhook_url,
                  data=body,
                  headers={
                      'Content-Type': 'application/json',
                      'Accept': 'application/json'
                  },
                  method='POST'
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      print(f"Chunk {i+1}/{len(chunks)} — Status:", resp.status)
                      print("Response:", resp.read().decode())
              except urllib.error.HTTPError as e:
                  print(f"Chunk {i+1} — HTTP Error:", e.code, e.reason)
                  print("Response:", e.read().decode())
                  raise

              if i < len(chunks) - 1:
                  time.sleep(2)

          print(f"Done — sent {len(chunks)} message(s) to Teams.")
          PYEOF
