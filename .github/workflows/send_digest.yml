name: Send Vuln Digest to Teams

on:
  push:
    paths:
      - 'latest.json'

jobs:
  send-to-teams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Send to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          MESSAGE=$(python3 -c "
          import json, os
          with open('latest.json') as f:
              d = json.load(f)
          payload = {
              '@type': 'MessageCard',
              '@context': 'http://schema.org/extensions',
              'themeColor': 'FF0000',
              'summary': 'Daily Vulnerability Digest',
              'sections': [{'activityTitle': '🔐 Daily Vulnerability Digest - ' + d.get('date','Today'), 'text': d.get('message','No content')}]
          }
          print(json.dumps(payload))
          ")
          curl -X POST "$TEAMS_WEBHOOK_URL" \
               -H "Content-Type: application/json" \
               -d "$MESSAGE"
