name: Send Vuln Digest to Teams

on:
  push:
    paths:
      - 'latest.json'
  workflow_dispatch:

jobs:
  send-to-teams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Send to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, urllib.request, urllib.error

          with open('latest.json', encoding='utf-8') as f:
              d = json.load(f)

          message = (d.get('message') or 'No content').replace('\r\n', '\n')
          date    = d.get('date') or 'Today'

          CARD_BYTE_LIMIT = 24000   # Teams rejects messages over ~28 KB
          LINK_RE = r'\[([^\]\n]+)\]\((https?://[^\s)]+)\)'

          # ---------- helpers ----------
          def tb(text, **kw):
              block = {'type': 'TextBlock', 'text': text, 'wrap': True}
              block.update(kw)
              return block

          def add_severity_icon(line):
              m = re.search(r'Severity\W{0,6}(Critical|High|Medium|Low)\b', line, re.I)
              if not m:
                  return line
              icon = {'critical': '🔴', 'high': '🟠', 'medium': '🟡', 'low': '🟢'}[m.group(1).lower()]
              return icon + ' ' + line

          def bold_label(text):
              # "Product: X" -> "**Product:** X" (left alone if already bold)
              if text.startswith('**'):
                  return text
              return re.sub(r'^([A-Z][A-Za-z /()-]{1,30}):\s', r'**\1:** ', text)

          def to_blocks(md, skip_line=''):
              # Markdown digest -> list of Adaptive Card TextBlocks.
              # Cards render **bold**, _italic_ and [text](url) natively, but not # headings.
              blocks, gap = [], True
              for raw in md.split('\n'):
                  line = raw.strip()
                  if not line or re.fullmatch(r'[-*_]{3,}', line) or ' '.join(line.split()) == skip_line:
                      gap = True      # blank / rule / the summary already shown at the top
                      continue
                  spacing = 'Medium' if gap else 'Small'
                  gap = False

                  h = re.match(r'^(#{1,6})\s+(.+?)[\s#]*$', line)
                  if h:
                      level, title = len(h.group(1)), h.group(2).strip()
                      if level <= 2 and re.fullmatch(r'(🔐\s*)?vulnerability digest', title, re.I):
                          gap = True      # the card already has this title
                          continue
                      blocks.append(tb(title, weight='Bolder', size='Medium' if level <= 2 else 'Default',
                                       separator=True, spacing='Large'))
                      continue

                  if re.fullmatch(r'\*\*Finding\s+\d+[^*]*\*\*:?', line):
                      blocks.append(tb(line, separator=True, spacing='Large'))
                      continue

                  b = re.match(r'^[-*•]\s+(.+)$', line)
                  if b:
                      blocks.append(tb('• ' + add_severity_icon(bold_label(b.group(1))), spacing=spacing))
                      continue

                  blocks.append(tb(add_severity_icon(line), spacing=spacing))
              return blocks

          def plain_md(text):
              text = re.sub(LINK_RE, r'\1', text)
              return text.replace('**', '')

          def pick_summary(md):
              # Prefer the agent's own one-line summary; else the first real paragraph.
              s = ' '.join(str(d.get('summary') or '').split())
              if not s:
                  for para in re.split(r'\n\s*\n', md):
                      p = ' '.join(para.split())
                      if (not p or p.startswith('#') or re.match(r'^[-*•]\s', p)
                              or re.search(r'scan window|scope:', p, re.I)
                              or re.fullmatch(r'\*\*[^*]+\*\*:?', p)):
                          continue
                      s = p
                      break
              if not s:
                  return 'Open the full digest for details.'
              if len(s) > 400:
                  s = plain_md(s)[:400].rsplit(' ', 1)[0] + '…'
              return s

          def build_card(detail_blocks, note=None):
              details = list(detail_blocks)
              if note:
                  details.append(tb(note, isSubtle=True, size='Small', spacing='Medium'))
              details.append({'type': 'ActionSet', 'spacing': 'Medium', 'actions': [
                  {'type': 'Action.ToggleVisibility', 'title': 'Hide full digest ▴',
                   'targetElements': ['details', 'showBtn']}]})
              return {
                  'type': 'AdaptiveCard',
                  '$schema': 'http://adaptivecards.io/schemas/adaptive-card.json',
                  'version': '1.4',
                  'msteams': {'width': 'Full'},
                  'body': [
                      tb('🔐 Vulnerability Digest — ' + date, weight='Bolder', size='Medium'),
                      tb(summary, spacing='Small'),
                      {'type': 'ActionSet', 'id': 'showBtn', 'actions': [
                          {'type': 'Action.ToggleVisibility', 'title': 'Show full digest ▾',
                           'targetElements': ['details', 'showBtn']}]},
                      {'type': 'Container', 'id': 'details', 'isVisible': False, 'items': details},
                  ],
              }

          def card_json(card):
              return json.dumps(card, ensure_ascii=False, separators=(',', ':'))

          def card_bytes(card):
              return len(card_json(card).encode('utf-8'))

          def summary_html(text):
              text = text.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;')
              text = re.sub(r'\*\*(.+?)\*\*', r'<b>\1</b>', text)
              return re.sub(LINK_RE, r'<a href="\2">\1</a>', text)

          # ---------- build ----------
          summary = pick_summary(message)
          blocks  = to_blocks(message, skip_line=summary)
          card    = build_card(blocks)
          dropped = 0
          while card_bytes(card) > CARD_BYTE_LIMIT and blocks:
              blocks.pop()
              dropped += 1
              card = build_card(blocks, f'… {dropped} more line(s) not shown (Teams card size limit). '
                                        'The full digest is latest.json in the GitHub repo.')

          payload = {
              'date': date,
              'summary': summary,
              # card = Adaptive Card JSON as a string, for "Post card in a chat or channel"
              'card': card_json(card),
              # message = short HTML fallback, used only if the flow still has "Post message"
              'message': '<b>🔐 Vulnerability Digest — ' + date + '</b><br>' + summary_html(summary),
          }

          req = urllib.request.Request(
              os.environ['TEAMS_WEBHOOK_URL'],
              data=json.dumps(payload).encode('utf-8'),
              headers={'Content-Type': 'application/json', 'Accept': 'application/json'},
              method='POST',
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print('Status:', resp.status)
                  print('Response:', resp.read().decode())
          except urllib.error.HTTPError as e:
              print('HTTP Error:', e.code, e.reason)
              print('Response:', e.read().decode())
              raise

          print(f'Done: card {card_bytes(card)} bytes, {len(blocks)} detail lines'
                + (f', {dropped} dropped for size' if dropped else '') + '.')
          PYEOF
